<style>
        body { font-family: 'Manrope', sans-serif; }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background min-h-screen text-on-surface flex justify-center">
<!-- App Container (Simulating Mobile View) -->
<div class="w-full max-w-[400px] h-screen bg-surface-container-lowest rounded-[22px] overflow-hidden flex flex-col relative shadow-xl mx-auto my-auto sm:h-[850px] sm:my-8 border border-surface-variant">
<!-- Top Section -->
<header class="flex items-start justify-between px-margin-mobile pt-lg pb-md">
<div class="flex flex-col">
<span class="text-on-surface-variant font-label-sm text-label-sm mb-xs">Monday, 17 August</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Hey Alex</h1>
</div>
<div class="w-[34px] h-[34px] rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-title-md text-title-md shrink-0 shadow-sm">
                A
            </div>
</header>
<!-- Main Content Scrollable Area -->
<main class="flex-1 overflow-y-auto px-margin-mobile pb-32 no-scrollbar flex flex-col gap-xl">
<!-- Status Ring Section -->
<section class="flex flex-col items-center justify-center">
<div class="relative w-[150px] h-[150px] flex items-center justify-center">
<svg class="w-full h-full drop-shadow-sm" viewbox="0 0 150 150">
<circle class="text-secondary/10" cx="75" cy="75" fill="transparent" r="65" stroke="currentColor" stroke-linecap="round" stroke-width="10"></circle>
<circle class="progress-ring__circle text-secondary-container" cx="75" cy="75" fill="transparent" r="65" stroke="currentColor" stroke-dasharray="408.4" stroke-dashoffset="102.1" stroke-linecap="round" stroke-width="10"></circle>
</svg>
<div class="absolute flex flex-col items-center">
<span class="font-display-metric text-display-metric text-on-surface">4</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">bunks left</span>
</div>
</div>
<p class="mt-md font-title-md text-title-md text-secondary">You're safe this week</p>
</section>
<!-- Up Next Section -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider pl-xs">Up next</h2>
<div class="bg-surface rounded-xl p-md shadow-[0_4px_16px_rgba(0,0,0,0.04)] relative">
<div class="absolute top-md right-md w-2 h-2 rounded-full bg-primary-container"></div>
<h3 class="font-title-md text-title-md text-on-surface mb-xs">Database Systems</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg">10:00–10:50 · Room 4B</p>
<div class="flex gap-sm w-full">
<button class="flex-1 bg-tertiary-container/20 text-tertiary rounded-full py-sm flex items-center justify-center gap-xs hover:bg-tertiary-container/30 transition-colors">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1">close</span>
<span class="font-label-sm text-label-sm">Missed</span>
</button>
<button class="flex-1 bg-secondary text-on-secondary rounded-full py-sm flex items-center justify-center gap-xs hover:bg-secondary/90 transition-colors shadow-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1">check</span>
<span class="font-label-sm text-label-sm">Attended</span>
</button>
</div>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant/70 mt-md">Swipe the card, or tap a button</p>
</div>
</section>
<!-- Footer Link -->
<div class="flex justify-center mt-auto">
<a class="text-primary font-label-sm text-label-sm hover:underline hover:text-primary/80 transition-colors" href="#">View today's full schedule</a>
</div>
</main>
<!-- Bottom Navigation Shell (Destination Screen) -->
<nav class="fixed bottom-0 left-0 w-full h-20 flex justify-around items-center px-4 pb-safe bg-surface-container-low shadow-[0_-4px_16px_rgba(0,0,0,0.04)] shadow-lg rounded-t-xl z-50 sm:absolute">
<!-- Active Navigation (Home) -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 active:scale-90 duration-200 ease-out hover:bg-surface-variant/50 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<!-- Inactive Navigation -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 active:scale-90 duration-200 ease-out hover:bg-surface-variant/50 transition-all">
<span class="material-symbols-outlined">insights</span>
<span class="font-label-sm text-label-sm mt-1">Stats</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 active:scale-90 duration-200 ease-out hover:bg-surface-variant/50 transition-all">
<span class="material-symbols-outlined">calendar_today</span>
<span class="font-label-sm text-label-sm mt-1">Calendar</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 active:scale-90 duration-200 ease-out hover:bg-surface-variant/50 transition-all">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</button>
</nav>
</div>
