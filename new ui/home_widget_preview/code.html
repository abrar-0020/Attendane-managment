<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AttendMe - Home Screen Widget</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#126d27",
                        "secondary-fixed": "#9ff79f",
                        "on-error": "#ffffff",
                        "surface": "#f8f9fa",
                        "on-secondary-fixed": "#002105",
                        "inverse-surface": "#2e3132",
                        "on-secondary-fixed-variant": "#005318",
                        "on-surface": "#191c1d",
                        "error": "#ba1a1a",
                        "on-primary-container": "#f8f6ff",
                        "tertiary-container": "#ce3b3b",
                        "on-background": "#191c1d",
                        "on-tertiary-container": "#fff5f4",
                        "background": "#f8f9fa",
                        "inverse-primary": "#bac3ff",
                        "tertiary-fixed-dim": "#ffb3ae",
                        "surface-container-high": "#e7e8e9",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e1e3e4",
                        "inverse-on-surface": "#f0f1f2",
                        "tertiary-fixed": "#ffdad7",
                        "on-surface-variant": "#454651",
                        "secondary-fixed-dim": "#83da85",
                        "on-primary-fixed": "#00105b",
                        "outline": "#767683",
                        "secondary-container": "#9cf49c",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#c6c5d3",
                        "primary-fixed-dim": "#bac3ff",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f3f4f5",
                        "surface-container-highest": "#e1e3e4",
                        "on-secondary-container": "#19722b",
                        "primary-container": "#5c6bc0",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#910816",
                        "surface-container": "#edeeef",
                        "on-tertiary-fixed": "#410004",
                        "on-tertiary": "#ffffff",
                        "primary": "#4352a5",
                        "surface-bright": "#f8f9fa",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#2f3f92",
                        "tertiary": "#ab2126",
                        "surface-tint": "#4858ab",
                        "surface-dim": "#d9dadb",
                        "primary-fixed": "#dee0ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "widget": "1rem" // Added for explicit widget roundness
                    },
                    "spacing": {
                        "base": "8px",
                        "margin-desktop": "48px",
                        "lg": "40px",
                        "sm": "12px",
                        "margin-mobile": "16px",
                        "xl": "64px",
                        "gutter": "24px",
                        "md": "24px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "title-md": ["Manrope", "sans-serif"],
                        "headline-lg": ["Manrope", "sans-serif"],
                        "body-md": ["Manrope", "sans-serif"],
                        "headline-lg-mobile": ["Manrope", "sans-serif"],
                        "display-metric": ["Manrope", "sans-serif"],
                        "label-sm": ["Manrope", "sans-serif"]
                    },
                    "fontSize": {
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-metric": ["48px", { "lineHeight": "56px", "letterSpacing": "-1px", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex items-center justify-center p-4">
<!-- Simulating the mobile screen canvas for context -->
<div class="relative w-full max-w-[400px] h-[800px] bg-surface-container-low rounded-[2.5rem] shadow-2xl overflow-hidden border-[8px] border-surface-container-high flex flex-col pt-12 px-4 pb-8">
<!-- Status Bar Simulation -->
<div class="absolute top-0 left-0 w-full h-12 flex items-center justify-between px-6 text-on-surface-variant font-label-sm text-label-sm z-10">
<span>9:41</span>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="signal_cellular_4_bar">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px]" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[16px]" data-icon="battery_full">battery_full</span>
</div>
</div>
<div class="flex-1 flex flex-col gap-6 mt-8">
<!-- Simulated App Icons above the widget for context -->
<div class="grid grid-cols-4 gap-4 mb-4">
<div class="aspect-square bg-primary-fixed rounded-2xl flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="mail">mail</span>
</div>
<div class="aspect-square bg-surface-container-highest rounded-2xl flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-surface text-3xl" data-icon="calendar_month">calendar_month</span>
</div>
<div class="aspect-square bg-secondary-fixed rounded-2xl flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-secondary text-3xl" data-icon="chat">chat</span>
</div>
<div class="aspect-square bg-surface-container-highest rounded-2xl flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-surface text-3xl" data-icon="map">map</span>
</div>
</div>
<!-- The Widget (4x2 representation) -->
<!-- Using surface-container-lowest for max contrast against the background, minimal padding, rounded-widget (16px) -->
<div class="w-full bg-surface-container-lowest rounded-widget shadow-[0_4px_16px_rgba(0,0,0,0.04)] border border-surface-variant/50 flex items-center p-3 h-[88px] relative overflow-hidden group hover:shadow-[0_8px_24px_rgba(0,0,0,0.08)] transition-shadow duration-300">
<!-- Subtle background decorative element -->
<div class="absolute -right-8 -top-8 w-24 h-24 bg-primary-fixed/30 rounded-full blur-2xl pointer-events-none"></div>
<div class="flex items-center w-full gap-3 relative z-10">
<!-- Left Side: Status Ring/Dot (Compact representation of attendance) -->
<div class="relative flex-shrink-0 flex items-center justify-center w-12 h-12">
<!-- Background track -->
<svg class="w-full h-full rotate-[-90deg]" viewbox="0 0 36 36">
<path class="text-secondary/10" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="4"></path>
<!-- Progress arc (Present) -->
<path class="text-secondary" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="90, 100" stroke-linecap="round" stroke-width="4"></path>
</svg>
<!-- Inner content -->
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="material-symbols-outlined text-secondary text-[20px]" data-icon="check_circle" data-weight="fill">check_circle</span>
</div>
</div>
<!-- Right Side: Next Class Info (Compact) -->
<div class="flex-1 min-w-0 flex flex-col justify-center">
<div class="flex items-center gap-1.5 mb-0.5">
<div class="w-2 h-2 rounded-full bg-primary flex-shrink-0"></div>
<span class="font-label-sm text-label-sm text-primary font-bold uppercase tracking-wider truncate">Next Class</span>
</div>
<h3 class="font-title-md text-title-md text-on-surface truncate leading-tight">Advanced Physics II</h3>
<p class="font-body-md text-body-md text-on-surface-variant truncate text-sm mt-0.5 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="schedule">schedule</span>
                            10:30 AM - Room 402
                        </p>
</div>
</div>
</div>
<!-- Simulated App Icons below the widget -->
<div class="grid grid-cols-4 gap-4 mt-2">
<div class="aspect-square bg-tertiary-fixed rounded-2xl flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-tertiary text-3xl" data-icon="music_note">music_note</span>
</div>
<div class="aspect-square bg-surface-container-highest rounded-2xl flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-surface text-3xl" data-icon="camera">camera</span>
</div>
<div class="aspect-square bg-surface-container-highest rounded-2xl flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-surface text-3xl" data-icon="settings">settings</span>
</div>
<div class="aspect-square bg-surface-container-highest rounded-2xl flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-surface text-3xl" data-icon="folder">folder</span>
</div>
</div>
<!-- Bottom dock area simulator -->
<div class="mt-auto mb-4 bg-surface-container/80 backdrop-blur-md p-4 rounded-3xl flex justify-around shadow-sm">
<div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center text-on-primary shadow-sm">
<span class="material-symbols-outlined" data-icon="phone" data-weight="fill">phone</span>
</div>
<div class="w-12 h-12 bg-surface-container-highest rounded-full flex items-center justify-center text-on-surface shadow-sm">
<span class="material-symbols-outlined" data-icon="sms" data-weight="fill">sms</span>
</div>
<div class="w-12 h-12 bg-surface-container-highest rounded-full flex items-center justify-center text-on-surface shadow-sm">
<span class="material-symbols-outlined" data-icon="language">language</span>
</div>
<div class="w-12 h-12 bg-surface-container-highest rounded-full flex items-center justify-center text-on-surface shadow-sm">
<span class="material-symbols-outlined" data-icon="photo_camera" data-weight="fill">photo_camera</span>
</div>
</div>
</div>
</div>
</body></html>
