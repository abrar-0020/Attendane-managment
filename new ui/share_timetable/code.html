<div class="flex items-center justify-between px-margin-mobile h-16 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-sm">

</div>
<button class="hover:bg-surface-container dark:hover:bg-surface-container-high rounded-full transition-colors active:scale-95 duration-100 p-2 text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
</header>
<!-- Dummy Calendar Main Content -->
<main class="flex-1 px-margin-mobile py-md max-w-7xl w-full mx-auto flex flex-col gap-md">
<div class="w-full flex justify-between items-end mb-sm">
<div>
<h2 class="font-title-md text-title-md text-on-surface">This Week</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Oct 24 - 30</p>
</div>
<button class="bg-primary/10 text-primary font-label-sm text-label-sm px-4 py-2 rounded-full font-semibold">Today</button>
</div>
<div class="bg-surface-container-low rounded-xl p-md flex flex-col gap-sm border border-outline-variant/10">
<div class="w-16 h-4 bg-outline-variant/20 rounded-full"></div>
<div class="w-3/4 h-8 bg-surface-container-highest rounded-lg"></div>
<div class="w-1/2 h-4 bg-outline-variant/10 rounded-full"></div>
</div>
<div class="bg-surface-container-low rounded-xl p-md flex flex-col gap-sm border border-outline-variant/10">
<div class="w-16 h-4 bg-outline-variant/20 rounded-full"></div>
<div class="w-full h-8 bg-surface-container-highest rounded-lg"></div>
<div class="w-2/3 h-4 bg-outline-variant/10 rounded-full"></div>
</div>

<span class="material-symbols-outlined text-[24px]">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<!-- Inactive Stats -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 rounded-full transition-all active:scale-90 duration-200 ease-out">
<span class="material-symbols-outlined text-[24px]">insights</span>
<span class="font-label-sm text-label-sm mt-1">Stats</span>
</button>

<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-container text-on-secondary-container dark:text-secondary-fixed rounded-full px-5 py-1 hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 transition-all active:scale-90 duration-200 ease-out">
<span class="material-symbols-outlined text-[24px] fill-icon">calendar_today</span>
<span class="font-label-sm text-label-sm mt-1 font-bold">Calendar</span>
</button>

<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 rounded-full transition-all active:scale-90 duration-200 ease-out">
<span class="material-symbols-outlined text-[24px]">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</button>

<div class="w-12 h-[5px] bg-outline-variant/40 rounded-full mb-xs"></div>

<h2 class="font-title-md text-title-md text-on-surface w-full text-center">Share your timetable</h2>

<div class="w-full bg-surface-container-low rounded-[20px] p-md flex flex-col items-center justify-center gap-xs border border-surface-container-highest">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-[0.1em]">Share Code</span>
<span class="font-display-metric text-display-metric text-primary tracking-wider mt-1">AM-7X29K</span>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-title-md text-title-md py-4 rounded-full flex items-center justify-center gap-sm active:scale-[0.98] transition-transform shadow-sm hover:shadow-md">
<span class="material-symbols-outlined text-[20px]">content_copy</span>
                Copy code
            </button>

</div>

<div class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:bg-surface-container-highest transition-colors">

<div class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[28px]">mail</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Mail</span>
</button>
<button class="flex flex-col items-center gap-2 group active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[28px]">qr_code_scanner</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">QR Code</span>
</button>
<button class="flex flex-col items-center gap-2 group active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:bg-surface-container-highest transition-colors">
