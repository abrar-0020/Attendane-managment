<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AttendMe - Stats</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#126d27",
                        "secondary-fixed": "#9ff79f",
                        "on-error": "#ffffff",
                        "surface": "#f8f9fa",
                        "on-secondary-fixed": "#002105",
                        "inverse-surface": "#2e3132",
                        "on-secondary-fixed-variant": "#005318",
                        "on-surface": "#191c1d",
                        "error": "#ba1a1a",
                        "on-primary-container": "#f8f6ff",
                        "tertiary-container": "#ce3b3b",
                        "on-background": "#191c1d",
                        "on-tertiary-container": "#fff5f4",
                        "background": "#f8f9fa",
                        "inverse-primary": "#bac3ff",
                        "tertiary-fixed-dim": "#ffb3ae",
                        "surface-container-high": "#e7e8e9",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e1e3e4",
                        "inverse-on-surface": "#f0f1f2",
                        "tertiary-fixed": "#ffdad7",
                        "on-surface-variant": "#454651",
                        "secondary-fixed-dim": "#83da85",
                        "on-primary-fixed": "#00105b",
                        "outline": "#767683",
                        "secondary-container": "#9cf49c",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#c6c5d3",
                        "primary-fixed-dim": "#bac3ff",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f3f4f5",
                        "surface-container-highest": "#e1e3e4",
                        "on-secondary-container": "#19722b",
                        "primary-container": "#5c6bc0",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#910816",
                        "surface-container": "#edeeef",
                        "on-tertiary-fixed": "#410004",
                        "on-tertiary": "#ffffff",
                        "primary": "#4352a5",
                        "surface-bright": "#f8f9fa",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#2f3f92",
                        "tertiary": "#ab2126",
                        "surface-tint": "#4858ab",
                        "surface-dim": "#d9dadb",
                        "primary-fixed": "#dee0ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "margin-desktop": "48px",
                        "lg": "40px",
                        "sm": "12px",
                        "margin-mobile": "16px",
                        "xl": "64px",
                        "gutter": "24px",
                        "md": "24px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "title-md": ["manrope"],
                        "headline-lg": ["manrope"],
                        "body-md": ["manrope"],
                        "headline-lg-mobile": ["manrope"],
                        "display-metric": ["manrope"],
                        "label-sm": ["manrope"]
                    },
                    "fontSize": {
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-metric": ["48px", { "lineHeight": "56px", "letterSpacing": "-1px", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .circular-chart { display: block; margin: 0 auto; max-width: 80%; max-height: 250px; }
        .circle-bg { fill: none; stroke: currentColor; stroke-width: 3.8; opacity: 0.1; }
        .circle { fill: none; stroke-width: 3.8; stroke-linecap: round; transition: stroke-dasharray 1s ease-out; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface flex items-center justify-between px-margin-mobile h-16 w-full max-w-7xl mx-auto w-full top-0 sticky z-40">
<div class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">AttendMe</div>
<button class="text-primary hover:bg-surface-container rounded-full transition-colors p-2 flex items-center justify-center active:scale-95 duration-100">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile pt-sm pb-32 max-w-md mx-auto w-full">
<!-- Overall Stats Ring Section -->
<section class="bg-surface-container-lowest rounded-xl p-md mb-lg shadow-[0_4px_16px_rgba(0,0,0,0.02)] border border-surface-variant/40 flex flex-col items-center justify-center relative overflow-hidden">
<!-- Subtle background accent -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
<h2 class="font-title-md text-title-md text-on-surface mb-sm w-full text-left">Overall Status</h2>
<div class="relative w-40 h-40 flex items-center justify-center my-md">
<svg class="circular-chart w-full h-full text-primary transform -rotate-90" viewbox="0 0 36 36">
<path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>
<!-- 75% attendance -> 75, 100 -->
<path class="circle stroke-primary" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" stroke-dasharray="75, 100"></path>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center pt-2">
<span class="font-display-metric text-display-metric text-primary">14</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide mt-xs">Bunks Left</span>
</div>
</div>
<div class="flex justify-between w-full px-sm pt-sm border-t border-surface-variant/30">
<div class="flex flex-col items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant">Attended</span>
<span class="font-title-md text-title-md text-on-surface">112</span>
</div>
<div class="flex flex-col items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant">Missed</span>
<span class="font-title-md text-title-md text-on-surface">24</span>
</div>
<div class="flex flex-col items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant">Total</span>
<span class="font-title-md text-title-md text-on-surface">136</span>
</div>
</div>
</section>
<!-- Subject Rows Section -->
<section>
<h3 class="font-title-md text-title-md text-on-surface mb-md px-xs">Subject Breakdown</h3>
<div class="flex flex-col gap-sm">
<!-- Safe Row (Green/Secondary) -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0_2px_8px_rgba(0,0,0,0.02)] border border-surface-variant/40 hover:bg-surface-bright transition-colors cursor-pointer group">
<div class="flex justify-between items-center mb-sm">
<div class="flex items-center gap-sm">
<div class="w-3 h-3 rounded-full bg-secondary ring-4 ring-secondary/20"></div>
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">Data Structures</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container py-1 px-3 rounded-full">5 bunks left</span>
</div>
<div class="w-full h-1.5 bg-surface-variant/50 rounded-full overflow-hidden">
<div class="h-full bg-secondary w-[85%] rounded-full"></div>
</div>
</div>
<!-- Warning Row (Amber/Tertiary-ish, using outline for a muted warning tone) -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0_2px_8px_rgba(0,0,0,0.02)] border border-surface-variant/40 hover:bg-surface-bright transition-colors cursor-pointer group">
<div class="flex justify-between items-center mb-sm">
<div class="flex items-center gap-sm">
<div class="w-3 h-3 rounded-full bg-[#f59e0b] ring-4 ring-[#f59e0b]/20"></div> <!-- Using explicit amber for semantic requirement outside strict strict tokens to meet "amber" prompt while keeping harmony -->
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">Computer Networks</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container py-1 px-3 rounded-full">1 bunk left</span>
</div>
<div class="w-full h-1.5 bg-surface-variant/50 rounded-full overflow-hidden">
<div class="h-full bg-[#f59e0b] w-[75%] rounded-full"></div>
</div>
</div>
<!-- Danger Row (Coral/Error) -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0_2px_8px_rgba(0,0,0,0.02)] border border-error/20 hover:bg-error-container/10 transition-colors cursor-pointer group">
<div class="flex justify-between items-center mb-sm">
<div class="flex items-center gap-sm">
<div class="w-3 h-3 rounded-full bg-error ring-4 ring-error/20"></div>
<span class="font-title-md text-title-md text-on-surface group-hover:text-error transition-colors">Operating Systems</span>
</div>
<span class="font-label-sm text-label-sm text-error bg-error-container/50 py-1 px-3 rounded-full font-bold">Attend next 2</span>
</div>
<div class="w-full h-1.5 bg-surface-variant/50 rounded-full overflow-hidden">
<div class="h-full bg-error w-[68%] rounded-full"></div>
</div>
</div>
<!-- Safe Row (Primary/Indigo) -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0_2px_8px_rgba(0,0,0,0.02)] border border-surface-variant/40 hover:bg-surface-bright transition-colors cursor-pointer group">
<div class="flex justify-between items-center mb-sm">
<div class="flex items-center gap-sm">
<div class="w-3 h-3 rounded-full bg-primary ring-4 ring-primary/20"></div>
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">Database Systems</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container py-1 px-3 rounded-full">8 bunks left</span>
</div>
<div class="w-full h-1.5 bg-surface-variant/50 rounded-full overflow-hidden">
<div class="h-full bg-primary w-[92%] rounded-full"></div>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface-container-low shadow-[0_-4px_16px_rgba(0,0,0,0.04)] fixed bottom-0 w-full z-50 rounded-t-xl left-0 h-20 flex justify-around items-center px-4 pb-safe border-t border-surface-variant/20 md:hidden">
<!-- Home (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 rounded-full transition-all px-5 py-1 active:scale-90 duration-200 ease-out group" href="#">
<span class="material-symbols-outlined text-[24px] group-hover:text-primary transition-colors">home</span>
<span class="font-label-sm text-label-sm mt-1 group-hover:text-primary transition-colors">Home</span>
</a>
<!-- Stats (Active) -->
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 transition-all active:scale-90 duration-200 ease-out shadow-sm" href="#">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">insights</span>
<span class="font-label-sm text-label-sm mt-1 font-bold">Stats</span>
</a>
<!-- Calendar (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 rounded-full transition-all px-5 py-1 active:scale-90 duration-200 ease-out group" href="#">
<span class="material-symbols-outlined text-[24px] group-hover:text-primary transition-colors">calendar_today</span>
<span class="font-label-sm text-label-sm mt-1 group-hover:text-primary transition-colors">Calendar</span>
</a>
<!-- Settings (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 rounded-full transition-all px-5 py-1 active:scale-90 duration-200 ease-out group" href="#">
<span class="material-symbols-outlined text-[24px] group-hover:text-primary transition-colors">settings</span>
<span class="font-label-sm text-label-sm mt-1 group-hover:text-primary transition-colors">Settings</span>
</a>
</nav>
</body></html>
