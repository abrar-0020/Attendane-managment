</div>
<button class="w-10 h-10 flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-container dark:hover:bg-surface-container-high rounded-full transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</div>
</header>
<main class="w-full max-w-3xl mx-auto px-margin-mobile md:px-margin-desktop py-lg pb-32">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg mb-lg">Settings</h2>
<!-- Settings Groups -->
<div class="space-y-lg">
<!-- Group: Profile -->
<section>
<h3 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-sm px-4">Profile</h3>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.04)] overflow-hidden">
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors text-left active:bg-surface-container">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-outline">person</span>
<span class="font-body-md text-body-md">Edit Profile</span>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</div>
</section>
<!-- Group: Preferences -->
<section>
<h3 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-sm px-4">Preferences</h3>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.04)] overflow-hidden">
<div class="flex items-center justify-between p-4 border-b border-surface-variant">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-outline">target</span>
<span class="font-body-md text-body-md">Attendance Goal</span>
</div>
<div class="flex items-center gap-2">
<span class="font-title-md text-title-md text-primary">90%</span>
<span class="material-symbols-outlined text-outline-variant text-sm">edit</span>
</div>
</div>
<div class="flex items-center justify-between p-4 border-b border-surface-variant">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-outline">dark_mode</span>
<span class="font-body-md text-body-md">Dark Theme</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors text-left active:bg-surface-container">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-outline">notifications_active</span>
<span class="font-body-md text-body-md">Notifications</span>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</div>
</section>
<!-- Group: Data -->
<section>
<h3 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-sm px-4">Data</h3>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.04)] overflow-hidden">
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors text-left active:bg-surface-container">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-outline">download</span>
<span class="font-body-md text-body-md">Export Data</span>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</div>
</section>

<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</button>
